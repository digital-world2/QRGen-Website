<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Profile Card - QR Gen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        qrGold: {
                            DEFAULT: '#C6A16B', // The specific gold from your logo
                            light: '#DFD2B4',
                            dark: '#A08053'
                        },
                        qrTeal: {
                            DEFAULT: '#02535F', // The deep teal from your logo
                            light: '#037E8F',
                            dark: '#013D46'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="max-w-sm w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        
        <div class="bg-gradient-to-br from-qrTeal via-qrTeal-dark to-qrTeal h-36 relative flex flex-col justify-between p-4">
            
            <div class="flex items-center justify-between z-10">
                <a href="#" >
                    <img src="logo.png" alt="QR Shield" class="w-14 h-14 rounded-full">
                </a>

                <a href="#" target="_blank" class="flex items-center gap-1 text-[13px] font-medium bg-qrGold text-white px-2.5 py-1 rounded-full shadow hover:bg-qrGold-light transition">
                    <span>Visit Our Website</span>
                    <i class="fa-solid fa-qrcode text-[9px]"></i>
                </a>
            </div>

            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 scale-110">
                <img src="qr_shield_logo_integrated.png" alt="QR Shield Integrated" class="w-full h-full object-contain">
            </div>

            <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 w-24 h-24 bg-white p-1 rounded-full shadow-lg">
                <div class="w-full h-full bg-slate-100 rounded-full flex items-center justify-center text-qrTeal text-3xl font-bold border-4 border-qrTeal/10">
                    <i class="fa-solid fa-user-check"></i>
                </div>
            </div>
        </div>

        <div class="pt-14 pb-8 px-6 text-center">
            <h2 id="cardName" class="text-2xl font-bold text-slate-800">...</h2>
            <p class="text-xs font-semibold text-qrGold-dark mt-1 uppercase tracking-wider">Verified Contact Profile</p>

            <div class="mt-6 space-y-3">
                
                <a id="simCallBtn" href="#" class="w-full bg-qrTeal hover:bg-qrTeal-light text-white font-semibold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-3 text-sm">
                    <i class="fa-solid fa-phone-flip text-base"></i> Direct Phone Call (SIM)
                </a>

                <a id="whatsappBtn" href="#" target="_blank" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-3 text-sm">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Open WhatsApp Chat
                </a>

                <a id="mapBtn" href="#" target="_blank" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-3 text-sm">
                    <i class="fa-solid fa-map-location-dot text-lg"></i> Open Location on Map
                </a>

            </div>

            <div class="mt-6 pt-6 border-t border-slate-100 text-left space-y-3">
                <div class="flex items-center gap-3 text-slate-600 text-sm">
                    <i class="fa-solid fa-mobile-screen text-qrTeal-light w-5"></i>
                    <span id="displayPhone" class="font-medium">...</span>
                </div>
                <div class="flex items-start gap-3 text-slate-600 text-sm">
                    <i class="fa-solid fa-location-dot text-rose-500 w-5 mt-0.5"></i>
                    <span id="displayAddress" class="font-medium">...</span>
                </div>
            </div>

        </div>

        <div class="bg-slate-50 border-t border-slate-100 py-3 text-center text-xs text-slate-400">
            Smart Profile Card • Powered by <a href="https://qr-gen-mauve.vercel.app/" target="_blank" class="text-qrTeal font-semibold hover:underline">QR Gen</a>
        </div>

    </div>

    <script>
        // URL Query Parameters Parsing
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || 'Guest User';
        let phone = urlParams.get('phone') || '';
        const address = urlParams.get('address') || 'Location not specified';

        // Clean Phone number for WhatsApp International Format (+92)
        let formattedWhatsAppPhone = phone.replace(/[^0-9]/g, '');
        if (formattedWhatsAppPhone.startsWith('0')) {
            formattedWhatsAppPhone = '92' + formattedWhatsAppPhone.substring(1);
        }

        // Set Text Contents
        document.getElementById('cardName').innerText = name;
        document.getElementById('displayPhone').innerText = phone;
        document.getElementById('displayAddress').innerText = address;

        // Action Links Configuration
        document.getElementById('simCallBtn').href = `tel:${phone}`;
        document.getElementById('whatsappBtn').href = `https://wa.me/${formattedWhatsAppPhone}?text=${encodeURIComponent('Hello ' + name + ', I scanned your QR Code.')}`;
        document.getElementById('mapBtn').href = `http://googleusercontent.com/maps.google.com/3{encodeURIComponent(address)}`;
    </script>
</body>
</html>
